name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format
        run: npx prettier --check "src/**/*.{ts,html,css}"
      - name: Lint
        run: npx ng lint
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build (app and widget)
        run: npm run build
      - name: Widget size budget (20 kB gzipped)
        run: |
          size=$(gzip -c public/widget.js | wc -c)
          echo "widget.js: ${size} bytes gzipped"
          test "$size" -le 20480

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ragdesk-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
